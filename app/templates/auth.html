<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Register — AI Travel Planner</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h2 { margin-top: 0; color: #0f172a; font-size: 24px; text-align: center; }
    p.subtext { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #334155; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #2563eb; ring: 2px solid #93c5fd; }
    button.btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button.btn:hover { background: #1d4ed8; }
    .toggle-link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
    }
    .toggle-link a { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; }
    .toggle-link a:hover { text-decoration: underline; }
    .alert {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .alert-error { background: #fee2e2; color: #991b1b; }
    .alert-success { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

<div class="auth-card">
  <div id="alertBox" class="alert"></div>

  <!-- LOGIN FORM -->
  <div id="loginSection">
    <h2>Sign In</h2>
    <p class="subtext">Log in to plan and manage your trips</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">Log In</button>
    </form>
    <div class="toggle-link">
      Don't have an account? <a onclick="showRegister()">Create an account</a>
    </div>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerSection" style="display: none;">
    <h2>Create Account</h2>
    <p class="subtext">Get started with your AI travel assistant</p>
    <form id="registerForm">
      <div class="form-group">
        <label for="regFullName">Full Name</label>
        <input type="text" id="regFullName" placeholder="Jane Doe" />
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="regPassword">Password (max 72 chars)</label>
        <input type="password" id="regPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">Sign Up</button>
    </form>
    <div class="toggle-link">
      Already registered? <a onclick="showLogin()">Sign In</a>
    </div>
  </div>
</div>

<script>
  // Redirect to /planner immediately if user is already logged in
  if (localStorage.getItem("access_token")) {
    window.location.href = "/planner";
  }

  const alertBox = document.getElementById("alertBox");

  function showAlert(msg, isError = true) {
    alertBox.textContent = msg;
    alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
    alertBox.style.display = "block";
  }

  function showRegister() {
    alertBox.style.display = "none";
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("registerSection").style.display = "block";
  }

  function showLogin() {
    alertBox.style.display = "none";
    document.getElementById("registerSection").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
  }

  // Handle Login
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.style.display = "none";
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Login failed");

      // Save token and navigate to planner
      localStorage.setItem("access_token", data.access_token);
      window.location.href = "/planner";
    } catch (err) {
      showAlert(err.message, true);
    }
  });

  // Handle Registration
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.style.display = "none";
    const full_name = document.getElementById("regFullName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    try {
      const res = await fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ full_name, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Registration failed");

      showAlert("Registration successful! Please sign in.", false);
      setTimeout(showLogin, 1200);
    } catch (err) {
      showAlert(err.message, true);
    }
  });
</script>
</body>
</html>
